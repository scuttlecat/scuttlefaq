<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% if page.title %}
    <title>{{ page.title }} — {{ site.title }}</title>
  {% else %}
    <title>{{ site.title }}</title>
  {% endif %}

  <!-- ── Open Graph tags: this is what Discord reads ── -->
  <!-- FAQ pages set `summary` in their front matter, which becomes
       og:description. The index falls back to the site description. -->
  <meta property="og:type" content="{% if page.summary %}article{% else %}website{% endif %}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.summary | default: site.description | strip_newlines | strip }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="theme-color" content="{{ site.embed_color }}">
  <meta name="twitter:card" content="summary">

<style>
    :root {
      --ink: #d6dee9;
      --paper: #0a0e16;
      --panel: #0e1420;
      --accent: #c9a961;
      --rule: #1f2b3d;
      --muted: #8fa3bd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 17px/1.65 Roboto, 'Roboto', sans-serif;
    }
    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 3rem 1.25rem 5rem;
    }
    header.site {
      border-bottom: 1px solid var(--rule);
      padding-bottom: 1.5rem;
      margin-bottom: 2.5rem;
    }
    header.site h1 {
      margin: 0 0 .25rem;
      font-size: 2rem;
      letter-spacing: -0.01em;
    }
    header.site p { margin: 0; color: var(--muted); }
    header.site a { color: var(--ink); text-decoration: none; }
    a { color: var(--accent); }
    /* ── index toolbar (search + expand all) ── */
    .faq-toolbar {
      display: flex;
      gap: .6rem;
      margin-bottom: 1.25rem;
    }
    #faq-filter {
      flex: 1;
      min-width: 0;
      padding: .6rem .75rem;
      border: 1px solid var(--rule);
      border-radius: 5px;
      background: var(--panel);
      color: var(--ink);
      font: 15px/1.4 Roboto, sans-serif;
    }
    #faq-filter::placeholder { color: var(--muted); }
    #faq-filter:focus { outline: none; border-color: var(--accent); }
    .faq-toolbar button {
      padding: .6rem .85rem;
      border: 1px solid var(--rule);
      border-radius: 5px;
      background: var(--panel);
      color: var(--muted);
      font: 13px/1.4 system-ui, sans-serif;
      white-space: nowrap;
      cursor: pointer;
    }
    .faq-toolbar button:hover,
    .faq-toolbar button:focus-visible {
      color: var(--accent);
      border-color: var(--accent);
      outline: none;
    }
    .faq-empty {
      color: var(--muted);
      font-style: italic;
      margin: 1.5rem 0;
    }

    /* ── category accordion ── */
    .cat { border-top: 1px solid var(--rule); }
    .cat:last-child { border-bottom: 1px solid var(--rule); }
    .cat > summary {
      display: flex;
      align-items: center;
      gap: .55rem;
      padding: .95rem .25rem;
      font-size: 1.15rem;
      font-weight: 500;
      cursor: pointer;
      list-style: none;
      user-select: none;
    }
    .cat > summary::-webkit-details-marker { display: none; }
    .cat > summary::before {
      content: "";
      flex: none;
      width: 0;
      height: 0;
      border-left: 6px solid currentColor;
      border-top: 4.5px solid transparent;
      border-bottom: 4.5px solid transparent;
      transition: transform .15s ease;
    }
    .cat[open] > summary::before { transform: rotate(90deg); }
    .cat > summary:hover,
    .cat > summary:focus-visible { color: var(--accent); outline: none; }
    .cat .count {
      color: var(--muted);
      font-size: .8rem;
      font-weight: 400;
    }
    .cat-body { padding: 0 0 .6rem 1.35rem; }

    /* ── individual question ── */
    .q { border-top: 1px solid #16202e; }
    .q:first-child { border-top: none; }
    .q > summary {
      padding: .65rem .25rem;
      font-size: 1.02rem;
      cursor: pointer;
      list-style: none;
    }
    .q > summary::-webkit-details-marker { display: none; }
    .q > summary:hover,
    .q > summary:focus-visible { color: var(--accent); outline: none; }
    .q[open] > summary { color: var(--accent); }
    .q-body { padding: .15rem .25rem 1.1rem; }
    .q-body > :first-child { margin-top: 0; }
    .q[hidden], .cat[hidden] { display: none; }
    .permalink {
      font: 13px/1.4 system-ui, sans-serif;
      color: var(--muted);
      word-break: break-all;
    }
    .permalink a { color: var(--muted); }
    .answer-page h1 {
      font-size: 1.7rem;
      line-height: 1.3;
      margin: 0 0 1rem;
    }
    .image-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: .75rem;
      margin: 1.5rem 0;
    }
    .image-gallery a {
      display: block;
      overflow: hidden;
      border: 1px solid var(--rule);
      border-radius: 5px;
      background: var(--panel);
      cursor: zoom-in;
    }
    .image-gallery a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .image-gallery img {
      display: block;
      width: 100%;
      height: 150px;
      object-fit: cover;
      transition: opacity .15s ease, transform .15s ease;
    }
    .image-gallery a:hover img {
      opacity: .85;
      transform: scale(1.02);
    }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 3rem 1.25rem 1.25rem;
      background: rgb(0 0 0 / 88%);
    }
    .lightbox[hidden] { display: none; }
    .lightbox img {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 4.25rem);
      object-fit: contain;
      box-shadow: 0 8px 40px rgb(0 0 0 / 55%);
    }
    .lightbox__close {
      position: absolute;
      top: .75rem;
      right: .75rem;
      width: 2.5rem;
      height: 2.5rem;
      padding: 0;
      border: 1px solid rgb(255 255 255 / 35%);
      border-radius: 50%;
      background: rgb(10 14 22 / 80%);
      color: #fff;
      font: 1.75rem/1 system-ui, sans-serif;
      cursor: pointer;
    }
    .lightbox__close:hover,
    .lightbox__close:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      outline: none;
    }
    body.lightbox-open { overflow: hidden; }
    .backlink {
      display: inline-block;
      margin-top: 2.5rem;
      font: 14px/1 system-ui, sans-serif;
    }
    code {
      font-size: .88em;
      background: #1a2432;
      color: var(--ink);
      padding: .1em .35em;
      border-radius: 3px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font: 14px/1.5 system-ui, sans-serif;
      margin: 1.25rem 0;
    }
    th {
      text-align: left;
      padding: 8px 12px;
      color: var(--muted);
      font-weight: 500;
      font-size: 12px;
      letter-spacing: .06em;
      border-bottom: 1px solid var(--rule);
    }
    td {
      padding: 9px 12px;
      border-bottom: 1px solid #1a2432;
    }
    td:first-child {
      color: var(--accent);
      font-weight: 500;
    }
    td:last-child { text-align: right; }
    tr:last-child td { border-bottom: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p>{{ site.description }}</p>
    </header>
    <main>
      {{ content }}
    </main>
  </div>

  <div class="lightbox" role="dialog" aria-modal="true" aria-label="Image preview" hidden>
    <button class="lightbox__close" type="button" aria-label="Close image preview">&times;</button>
    <img class="lightbox__image" src="" alt="">
  </div>

  <script>
    (() => {
      const lightbox = document.querySelector('.lightbox');
      const lightboxImage = lightbox.querySelector('.lightbox__image');
      const closeButton = lightbox.querySelector('.lightbox__close');
      const page = document.querySelector('.wrap');
      let opener = null;

      const closeLightbox = () => {
        lightbox.hidden = true;
        lightboxImage.src = '';
        lightboxImage.alt = '';
        document.body.classList.remove('lightbox-open');
        page.inert = false;
        opener?.focus();
        opener = null;
      };

      document.addEventListener('click', (event) => {
        const link = event.target.closest('[data-lightbox]');
        if (!link) return;

        event.preventDefault();
        opener = link;
        lightboxImage.src = link.href;
        lightboxImage.alt = link.querySelector('img')?.alt || '';
        lightbox.hidden = false;
        document.body.classList.add('lightbox-open');
        page.inert = true;
        closeButton.focus();
      });

      closeButton.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) closeLightbox();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !lightbox.hidden) closeLightbox();
      });
    })();
  </script>

  <!-- ── index accordion: deep links, search filter, expand all ── -->
  <script>
    (() => {
      const list = document.querySelector('.faq-list');
      if (!list) return;

      const cats = [...list.querySelectorAll('details.cat')];
      const items = [...list.querySelectorAll('details.q')];
      const filter = document.getElementById('faq-filter');
      const expandBtn = document.getElementById('faq-expand');
      const empty = document.querySelector('.faq-empty');
      const filtering = () => filter.value.trim() !== '';

      // Open the category + question a #anchor points at, so every link
      // already shared on Discord still lands on a visible answer.
      const revealHash = (scroll) => {
        const id = decodeURIComponent(location.hash.slice(1));
        if (!id) return;
        const target = document.getElementById(id);
        if (!target || !target.classList.contains('q')) return;
        target.closest('details.cat')?.setAttribute('open', '');
        target.open = true;
        if (scroll) target.scrollIntoView({ block: 'center' });
      };
      revealHash(true);
      window.addEventListener('hashchange', () => revealHash(true));

      // Keep the URL pointing at whatever question is being read.
      items.forEach((q) => {
        q.addEventListener('toggle', () => {
          if (q.open && !filtering()) history.replaceState(null, '', '#' + q.id);
        });
      });

      const syncExpandBtn = () => {
        const allOpen = cats.every((c) => c.open);
        expandBtn.textContent = allOpen ? 'Collapse all' : 'Expand all';
        expandBtn.setAttribute('aria-expanded', String(allOpen));
      };
      expandBtn.addEventListener('click', () => {
        const open = !cats.every((c) => c.open);
        cats.forEach((c) => { c.open = open; });
        syncExpandBtn();
      });
      cats.forEach((c) => c.addEventListener('toggle', syncExpandBtn));
      syncExpandBtn();

      // Search: matches title + summary + answer text (see _includes/faq-item.html).
      // While filtering, matching categories are force-opened; the pre-search
      // open/closed state is restored when the box is cleared.
      let saved = null;
      const applyFilter = () => {
        const query = filter.value.trim().toLowerCase();

        if (!query) {
          items.forEach((q) => { q.hidden = false; });
          cats.forEach((c) => { c.hidden = false; });
          if (saved) {
            cats.forEach((c, i) => { c.open = saved.cats[i]; });
            items.forEach((q, i) => { q.open = saved.items[i]; });
            saved = null;
          }
          empty.hidden = true;
          syncExpandBtn();
          return;
        }

        if (!saved) {
          saved = { cats: cats.map((c) => c.open), items: items.map((q) => q.open) };
        }

        let total = 0;
        cats.forEach((cat) => {
          let shown = 0;
          cat.querySelectorAll('details.q').forEach((q) => {
            const hit = q.dataset.search.includes(query);
            q.hidden = !hit;
            if (hit) shown += 1;
          });
          cat.hidden = shown === 0;
          cat.open = shown > 0;
          total += shown;
        });
        empty.hidden = total > 0;
        syncExpandBtn();
      };

      filter.addEventListener('input', applyFilter);
      filter.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') { filter.value = ''; applyFilter(); }
      });
      if (filter.value) applyFilter(); // e.g. restored on back/forward
    })();
  </script>
</body>
</html>
