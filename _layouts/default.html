<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% if page.title %}
    <title>{{ page.title }} — {{ site.title }}</title>
  {% else %}
    <title>{{ site.title }}</title>
  {% endif %}

  <!-- ── Open Graph tags: this is what Discord reads ── -->
  <!-- FAQ pages set `summary` in their front matter, which becomes
       og:description. The index falls back to the site description. -->
  <meta property="og:type" content="{% if page.summary %}article{% else %}website{% endif %}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.summary | default: site.description | strip_newlines | strip }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="theme-color" content="{{ site.embed_color }}">
  <meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&family=Space+Mono:wght@700&display=swap">

  <style>

    :root {
      color-scheme: dark;
      --void: #0e1322;
      --nebula: #182038;
      --orbit: #2a3458;
      --on-orbit: #eef5e2;
      --on-orbit-muted: #b9c4d8;
      --hairline: #2e3854;
      --ink: #eef5e2;
      --ink-muted: #a9b5a0;
      --glorp: #a9d35f;
      --glorp-deep: #a9d35f;
      --glorp-soft: #2f4a1e;
      --on-glorp: #16280a;
      --blush: #ff9fc6;
      --starlight: #ffe082;
      --glow: 0 0 24px rgba(169, 211, 95, 0.35);

      --font-display: Fredoka, "Nunito", system-ui, sans-serif;
      --font-sans: Nunito, system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "Space Mono", ui-monospace, Menlo, monospace;

      --space-1: 4px;
      --space-2: 8px;
      --space-4: 16px;
      --space-6: 24px;
      --space-10: 40px;

      --radius-sm: 8px;
      --radius-lg: 20px;
      --radius-pill: 999px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --void: #f5f8ec;
        --nebula: #ffffff;
        --orbit: #1b2440;
        --on-orbit: #f5f8ec;
        --hairline: #d6dfc6;
        --ink: #172031;
        --ink-muted: #56604f;
        --glorp-deep: #46691f;
        --glorp-soft: #dcefbf;
        --blush: #ff8fbc;
        --starlight: #ffd45c;
        --glow: 0 6px 20px rgba(70, 105, 31, 0.18);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--void);
      color: var(--ink);
      font: 400 17px/1.65 var(--font-sans);
    }
    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: var(--space-10) var(--space-6) 5rem;
    }
    h1, h2, h3 { font-family: var(--font-display); font-weight: 600; }

    header.site {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      border-bottom: 1px solid var(--hairline);
      padding-bottom: var(--space-6);
      margin-bottom: var(--space-10);
    }
    header.site img {
      flex: none;
      width: 64px;
      height: 64px;
      border-radius: var(--radius-pill);
    }
    header.site h1 {
      margin: 0 0 var(--space-1);
      font-size: 36px;
      line-height: 42px;
    }
    header.site p { margin: 0; color: var(--ink-muted); }
    header.site a { color: var(--ink); text-decoration: none; }
    a { color: var(--glorp-deep); }

    /* ── index toolbar (search + expand all) ── */
    .faq-toolbar {
      display: flex;
      gap: var(--space-2);
      margin-bottom: var(--space-6);
    }
    #faq-filter {
      flex: 1;
      min-width: 0;
      height: 40px;
      padding: 0 var(--space-4);
      border: 1.5px solid var(--ink-muted);
      border-radius: var(--radius-sm);
      background: var(--nebula);
      color: var(--ink);
      font: 400 16px/1.4 var(--font-sans);
    }
    #faq-filter::placeholder { color: var(--ink-muted); }
    #faq-filter:focus {
      outline: 2px solid var(--glorp-deep);
      outline-offset: 2px;
      border-color: var(--glorp-deep);
    }
    /* Glorp secondary button */
    .faq-toolbar button {
      height: 40px;
      padding: 0 20px;
      border: 1.5px solid var(--ink-muted);
      border-radius: var(--radius-pill);
      background: var(--nebula);
      color: var(--ink);
      font: 700 15px/1 var(--font-sans);
      white-space: nowrap;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease;
    }
    .faq-toolbar button:hover { border-color: var(--ink); transform: translateY(-1px); }
    .faq-toolbar button:focus-visible {
      outline: 2px solid var(--glorp-deep);
      outline-offset: 3px;
      box-shadow: var(--glow);
    }
    .faq-empty {
      color: var(--ink-muted);
      margin: var(--space-6) 0;
    }

    /* ── category accordion: each category is a Glorp card ── */
    .faq-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
    .cat {
      background: var(--nebula);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .cat > summary {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-4) var(--space-6);
      font: 500 24px/30px var(--font-display);
      cursor: pointer;
      list-style: none;
      user-select: none;
    }
    .cat > summary::-webkit-details-marker { display: none; }
    .cat > summary::before {
      content: "";
      flex: none;
      width: 0;
      height: 0;
      margin-right: var(--space-1);
      border-left: 7px solid var(--glorp-deep);
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      transition: transform .15s ease;
    }
    .cat[open] > summary::before { transform: rotate(90deg); }
    .cat > summary:hover { color: var(--glorp-deep); }
    .cat > summary:focus-visible {
      color: var(--glorp-deep);
      outline: 2px solid var(--glorp-deep);
      outline-offset: -4px;
      border-radius: var(--radius-lg);
    }
    /* Glorp green tag */
    .cat .count {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 10px;
      border-radius: var(--radius-pill);
      background: var(--glorp-soft);
      color: var(--glorp-deep);
      font: 700 11px/1 var(--font-mono);
      letter-spacing: .08em;
    }
    .cat-body { padding: 0 var(--space-6) var(--space-2) calc(var(--space-6) + 19px); }

    /* ── individual question ── */
    .q { border-top: 1px solid var(--hairline); }
    .q > summary {
      padding: 12px 0;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      list-style: none;
    }
    .q > summary::-webkit-details-marker { display: none; }
    .q > summary:hover,
    .q[open] > summary { color: var(--glorp-deep); }
    .q > summary:focus-visible {
      color: var(--glorp-deep);
      outline: 2px solid var(--glorp-deep);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }
    .q-body { padding: 2px 0 var(--space-4); }
    .q-body > :first-child { margin-top: 0; }
    .q[hidden], .cat[hidden] { display: none; }
    .permalink {
      font: 600 14px/20px var(--font-sans);
      color: var(--ink-muted);
      word-break: break-all;
    }
    .permalink a { color: var(--ink-muted); }

    .answer-page h1 {
      font-size: 36px;
      line-height: 42px;
      margin: 0 0 var(--space-4);
    }
    .image-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: var(--space-4);
      margin: var(--space-6) 0;
    }
    .image-gallery a {
      display: block;
      overflow: hidden;
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      background: var(--nebula);
      cursor: zoom-in;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .image-gallery a:hover { transform: translateY(-2px); box-shadow: var(--glow); }
    .image-gallery a:focus-visible {
      outline: 2px solid var(--glorp-deep);
      outline-offset: 3px;
    }
    .image-gallery img {
      display: block;
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    /* Lightbox sits on an orbit-coloured scrim in both themes. */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 3rem 1.25rem 1.25rem;
      background: rgb(14 19 34 / 90%);
    }
    .lightbox[hidden] { display: none; }
    .lightbox img {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 4.25rem);
      object-fit: contain;
      border-radius: var(--radius-sm);
    }
    .lightbox__close {
      position: absolute;
      top: .75rem;
      right: .75rem;
      width: 2.5rem;
      height: 2.5rem;
      padding: 0;
      border: 1.5px solid var(--on-orbit-muted);
      border-radius: var(--radius-pill);
      background: var(--orbit);
      color: var(--on-orbit);
      font: 1.75rem/1 var(--font-sans);
      cursor: pointer;
    }
    .lightbox__close:hover,
    .lightbox__close:focus-visible {
      border-color: var(--glorp);
      color: var(--glorp);
      outline: none;
    }
    body.lightbox-open { overflow: hidden; }
    .backlink {
      display: inline-block;
      margin-top: var(--space-10);
      font: 700 15px/1 var(--font-sans);
    }
    code {
      font: 700 .85em var(--font-mono);
      background: var(--glorp-soft);
      color: var(--ink);
      padding: .1em .4em;
      border-radius: var(--radius-sm);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font: 400 15px/1.5 var(--font-sans);
      margin: var(--space-4) 0;
    }
    th {
      text-align: left;
      padding: var(--space-2) 12px;
      color: var(--ink-muted);
      font: 700 12px/16px var(--font-mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--hairline);
    }
    td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--hairline);
    }
    td:first-child {
      color: var(--glorp-deep);
      font-weight: 700;
    }
    td:last-child { text-align: right; }
    tr:last-child td { border-bottom: none; }

    @media (prefers-reduced-motion: reduce) {
      .cat > summary::before, .faq-toolbar button, .image-gallery a { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <img src="{{ '/assets/img/glorp.png' | relative_url }}" alt="" width="64" height="64">
      <div>
        <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        <p>{{ site.description }}</p>
      </div>
    </header>
    <main>
      {{ content }}
    </main>
  </div>

  <div class="lightbox" role="dialog" aria-modal="true" aria-label="Image preview" hidden>
    <button class="lightbox__close" type="button" aria-label="Close image preview">&times;</button>
    <img class="lightbox__image" src="" alt="">
  </div>

  <script>
    (() => {
      const lightbox = document.querySelector('.lightbox');
      const lightboxImage = lightbox.querySelector('.lightbox__image');
      const closeButton = lightbox.querySelector('.lightbox__close');
      const page = document.querySelector('.wrap');
      let opener = null;

      const closeLightbox = () => {
        lightbox.hidden = true;
        lightboxImage.src = '';
        lightboxImage.alt = '';
        document.body.classList.remove('lightbox-open');
        page.inert = false;
        opener?.focus();
        opener = null;
      };

      document.addEventListener('click', (event) => {
        const link = event.target.closest('[data-lightbox]');
        if (!link) return;

        event.preventDefault();
        opener = link;
        lightboxImage.src = link.href;
        lightboxImage.alt = link.querySelector('img')?.alt || '';
        lightbox.hidden = false;
        document.body.classList.add('lightbox-open');
        page.inert = true;
        closeButton.focus();
      });

      closeButton.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) closeLightbox();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !lightbox.hidden) closeLightbox();
      });
    })();
  </script>

  <!-- ── index accordion: deep links, search filter, expand all ── -->
  <script>
    (() => {
      const list = document.querySelector('.faq-list');
      if (!list) return;

      const cats = [...list.querySelectorAll('details.cat')];
      const items = [...list.querySelectorAll('details.q')];
      const filter = document.getElementById('faq-filter');
      const expandBtn = document.getElementById('faq-expand');
      const empty = document.querySelector('.faq-empty');
      const filtering = () => filter.value.trim() !== '';

      // Open the category + question a #anchor points at, so every link
      // already shared on Discord still lands on a visible answer.
      const revealHash = (scroll) => {
        const id = decodeURIComponent(location.hash.slice(1));
        if (!id) return;
        const target = document.getElementById(id);
        if (!target || !target.classList.contains('q')) return;
        target.closest('details.cat')?.setAttribute('open', '');
        target.open = true;
        if (scroll) target.scrollIntoView({ block: 'center' });
      };
      revealHash(true);
      window.addEventListener('hashchange', () => revealHash(true));

      // Keep the URL pointing at whatever question is being read.
      items.forEach((q) => {
        q.addEventListener('toggle', () => {
          if (q.open && !filtering()) history.replaceState(null, '', '#' + q.id);
        });
      });

      const syncExpandBtn = () => {
        const allOpen = cats.every((c) => c.open);
        expandBtn.textContent = allOpen ? 'Collapse all' : 'Expand all';
        expandBtn.setAttribute('aria-expanded', String(allOpen));
      };
      expandBtn.addEventListener('click', () => {
        const open = !cats.every((c) => c.open);
        cats.forEach((c) => { c.open = open; });
        syncExpandBtn();
      });
      cats.forEach((c) => c.addEventListener('toggle', syncExpandBtn));
      syncExpandBtn();

      // Search: matches title + summary + answer text (see _includes/faq-item.html).
      // While filtering, matching categories are force-opened; the pre-search
      // open/closed state is restored when the box is cleared.
      let saved = null;
      const applyFilter = () => {
        const query = filter.value.trim().toLowerCase();

        if (!query) {
          items.forEach((q) => { q.hidden = false; });
          cats.forEach((c) => { c.hidden = false; });
          if (saved) {
            cats.forEach((c, i) => { c.open = saved.cats[i]; });
            items.forEach((q, i) => { q.open = saved.items[i]; });
            saved = null;
          }
          empty.hidden = true;
          syncExpandBtn();
          return;
        }

        if (!saved) {
          saved = { cats: cats.map((c) => c.open), items: items.map((q) => q.open) };
        }

        let total = 0;
        cats.forEach((cat) => {
          let shown = 0;
          cat.querySelectorAll('details.q').forEach((q) => {
            const hit = q.dataset.search.includes(query);
            q.hidden = !hit;
            if (hit) shown += 1;
          });
          cat.hidden = shown === 0;
          cat.open = shown > 0;
          total += shown;
        });
        empty.hidden = total > 0;
        syncExpandBtn();
      };

      filter.addEventListener('input', applyFilter);
      filter.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') { filter.value = ''; applyFilter(); }
      });
      if (filter.value) applyFilter(); // e.g. restored on back/forward
    })();
  </script>
</body>
</html>
