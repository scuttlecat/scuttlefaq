<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% if page.title %}
    <title>{{ page.title }} — {{ site.title }}</title>
  {% else %}
    <title>{{ site.title }}</title>
  {% endif %}

  <!-- ── Open Graph tags: this is what Discord reads ── -->
  <!-- FAQ pages set `summary` in their front matter, which becomes
       og:description. The index falls back to the site description. -->
  <meta property="og:type" content="{% if page.summary %}article{% else %}website{% endif %}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.summary | default: site.description | strip_newlines | strip }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="theme-color" content="{{ site.embed_color }}">
  <meta name="twitter:card" content="summary">

<style>
    :root {
      --ink: #d6dee9;
      --paper: #0a0e16;
      --panel: #0e1420;
      --accent: #c9a961;
      --rule: #1f2b3d;
      --muted: #8fa3bd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 17px/1.65 Roboto, 'Roboto', sans-serif;
    }
    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 3rem 1.25rem 5rem;
    }
    header.site {
      border-bottom: 1px solid var(--rule);
      padding-bottom: 1.5rem;
      margin-bottom: 2.5rem;
    }
    header.site h1 {
      margin: 0 0 .25rem;
      font-size: 2rem;
      letter-spacing: -0.01em;
    }
    header.site p { margin: 0; color: var(--muted); }
    header.site a { color: var(--ink); text-decoration: none; }
    a { color: var(--accent); }
    .q {
      padding: 1.75rem 0;
      border-bottom: 1px solid var(--rule);
    }
    .q h2 {
      margin: 0 0 .6rem;
      font-size: 1.3rem;
      line-height: 1.35;
    }
    .q h2 a { color: var(--ink); text-decoration: none; }
    .q h2 a:hover { color: var(--accent); }
    .permalink {
      font: 13px/1.4 system-ui, sans-serif;
      color: var(--muted);
      word-break: break-all;
    }
    .permalink a { color: var(--muted); }
    .answer-page h1 {
      font-size: 1.7rem;
      line-height: 1.3;
      margin: 0 0 1rem;
    }
    .image-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: .75rem;
      margin: 1.5rem 0;
    }
    .image-gallery a {
      display: block;
      overflow: hidden;
      border: 1px solid var(--rule);
      border-radius: 5px;
      background: var(--panel);
      cursor: zoom-in;
    }
    .image-gallery a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .image-gallery img {
      display: block;
      width: 100%;
      height: 150px;
      object-fit: cover;
      transition: opacity .15s ease, transform .15s ease;
    }
    .image-gallery a:hover img {
      opacity: .85;
      transform: scale(1.02);
    }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 3rem 1.25rem 1.25rem;
      background: rgb(0 0 0 / 88%);
    }
    .lightbox[hidden] { display: none; }
    .lightbox img {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 4.25rem);
      object-fit: contain;
      box-shadow: 0 8px 40px rgb(0 0 0 / 55%);
    }
    .lightbox__close {
      position: absolute;
      top: .75rem;
      right: .75rem;
      width: 2.5rem;
      height: 2.5rem;
      padding: 0;
      border: 1px solid rgb(255 255 255 / 35%);
      border-radius: 50%;
      background: rgb(10 14 22 / 80%);
      color: #fff;
      font: 1.75rem/1 system-ui, sans-serif;
      cursor: pointer;
    }
    .lightbox__close:hover,
    .lightbox__close:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      outline: none;
    }
    body.lightbox-open { overflow: hidden; }
    .backlink {
      display: inline-block;
      margin-top: 2.5rem;
      font: 14px/1 system-ui, sans-serif;
    }
    code {
      font-size: .88em;
      background: #1a2432;
      color: var(--ink);
      padding: .1em .35em;
      border-radius: 3px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font: 14px/1.5 system-ui, sans-serif;
      margin: 1.25rem 0;
    }
    th {
      text-align: left;
      padding: 8px 12px;
      color: var(--muted);
      font-weight: 500;
      font-size: 12px;
      letter-spacing: .06em;
      border-bottom: 1px solid var(--rule);
    }
    td {
      padding: 9px 12px;
      border-bottom: 1px solid #1a2432;
    }
    td:first-child {
      color: var(--accent);
      font-weight: 500;
    }
    td:last-child { text-align: right; }
    tr:last-child td { border-bottom: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p>{{ site.description }}</p>
    </header>
    <main>
      {{ content }}
    </main>
  </div>

  <div class="lightbox" role="dialog" aria-modal="true" aria-label="Image preview" hidden>
    <button class="lightbox__close" type="button" aria-label="Close image preview">&times;</button>
    <img class="lightbox__image" src="" alt="">
  </div>

  <script>
    (() => {
      const lightbox = document.querySelector('.lightbox');
      const lightboxImage = lightbox.querySelector('.lightbox__image');
      const closeButton = lightbox.querySelector('.lightbox__close');
      const page = document.querySelector('.wrap');
      let opener = null;

      const closeLightbox = () => {
        lightbox.hidden = true;
        lightboxImage.src = '';
        lightboxImage.alt = '';
        document.body.classList.remove('lightbox-open');
        page.inert = false;
        opener?.focus();
        opener = null;
      };

      document.addEventListener('click', (event) => {
        const link = event.target.closest('[data-lightbox]');
        if (!link) return;

        event.preventDefault();
        opener = link;
        lightboxImage.src = link.href;
        lightboxImage.alt = link.querySelector('img')?.alt || '';
        lightbox.hidden = false;
        document.body.classList.add('lightbox-open');
        page.inert = true;
        closeButton.focus();
      });

      closeButton.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) closeLightbox();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !lightbox.hidden) closeLightbox();
      });
    })();
  </script>
</body>
</html>
