<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% if page.title %}
    <title>{{ page.title }} — {{ site.title }}</title>
  {% else %}
    <title>{{ site.title }}</title>
  {% endif %}

  <!-- ── Open Graph tags: this is what Discord reads ── -->
  <!-- FAQ pages set `summary` in their front matter, which becomes
       og:description. The index falls back to the site description. -->
  <meta property="og:type" content="{% if page.summary %}article{% else %}website{% endif %}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.summary | default: site.description | strip_newlines | strip }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="theme-color" content="{{ site.embed_color }}">
  <meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Anton&display=swap">

  <style>
    /* ── Throughline design system tokens ──
       One theme: a dark console. The four-stop spectrum is the only
       colour; everything else is ink, white, and white at low alpha. */
    :root {
      color-scheme: dark;
      --ink: #131417;
      --ink-2: #0e0f12;
      --navy: #1e293f;
      --navy-glow: #27365a;
      --glass: rgba(14, 15, 18, 0.55);
      --line: rgba(255, 255, 255, 0.09);
      --line-2: rgba(255, 255, 255, 0.16);
      --line-hover: rgba(255, 255, 255, 0.34);
      --wash: rgba(255, 255, 255, 0.04);
      --fg: #ffffff;
      --fg-hero: #f1fcff;
      --fg-dim: rgba(255, 255, 255, 0.64);
      --fg-faint: rgba(255, 255, 255, 0.4);
      --code-tint: #bfe9ff;
      --amber: #f7d152;
      --green: #46cf71;
      --cyan: #0fbffa;
      --focus: var(--cyan);

      --spectrum: linear-gradient(-45deg, #912acd 20%, #e6b71d, #16a242, #03b0ea 70%);
      --spectrum-flow: linear-gradient(90deg, #2cff84 0%, #06e4ff 12.5%, #ff54ff 25%, #ffe13a 37.5%, #2cff84 50%, #06e4ff 62.5%, #ff54ff 75%, #ffe13a 87.5%, #2cff84 100%);
      --shadow-focus: 0 0 0 4px rgba(15, 191, 250, 0.12);

      --font-mono: "Source Code Pro", ui-monospace, SFMono-Regular, Menlo, monospace;
      --font-display: Anton, Impact, "Source Code Pro", monospace;

      --space-12: 12px;
      --space-16: 16px;
      --space-24: 24px;
      --space-48: 48px;
      --space-72: 72px;
      --nav-height: 58px;
      --wrap: 880px;

      --radius-xs: 5px;
      --radius-sm: 10px;
      --radius-lg: 16px;
      --radius-pill: 999px;
      --blur-sm: 8px;
      --blur-md: 12px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--ink);
      color: var(--fg);
      font: 400 15px/1.65 var(--font-mono);
      -webkit-font-smoothing: antialiased;
    }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    ::selection { background: var(--cyan); color: var(--ink); }
    .wrap {
      max-width: var(--wrap);
      margin: 0 auto;
      padding: 0 var(--space-24);
    }
    a {
      color: var(--fg);
      text-decoration: underline;
      text-decoration-color: var(--cyan);
      text-underline-offset: 3px;
    }
    a:hover { color: var(--cyan); }
    .eyebrow {
      margin: 0;
      font-size: 11px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--fg-faint);
    }

    /* ── Nav: clear over the hero, solid ink everywhere else ── */
    .nav {
      height: var(--nav-height);
      background: rgba(19, 20, 23, .86);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(var(--blur-md));
      -webkit-backdrop-filter: blur(var(--blur-md));
    }
    .nav--clear {
      position: absolute;
      inset: 0 0 auto;
      z-index: 2;
      background: transparent;
      border-bottom-color: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .nav .wrap {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
    }
    .brand {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--fg);
      text-decoration: none;
    }
    .brand:hover { color: var(--fg); }
    .nav-link {
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--fg-dim);
      text-decoration: none;
      padding: 4px 0;
      border-bottom: 1px solid transparent;
    }
    .nav-link:hover { color: var(--fg); border-bottom-color: var(--cyan); }

    /* ── Hero: navy, lifted top-left, 22px dot grid ── */
    .hero {
      position: relative;
      overflow: hidden;
      padding: calc(var(--nav-height) + 56px) 0 var(--space-48);
      background: radial-gradient(120% 90% at 18% 0%, var(--navy-glow) 0%, transparent 58%), var(--navy);
      border-bottom: 1px solid var(--line);
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(var(--line-2) 1px, transparent 1.3px);
      background-size: 22px 22px;
      background-position: 11px 11px;
    }
    .hero .wrap { position: relative; }
    .poster {
      margin: 0 0 40px;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(46px, 11vw, 120px);
      line-height: 1.02;
      letter-spacing: -.018em;
      text-transform: uppercase;
      color: #fdfdfd;
    }
    .poster i {
      display: block;
      font-style: normal;
      text-shadow: 0 0 26px rgba(241, 252, 255, .1);
    }
    .poster i.flow {
      text-shadow: none;
      background-image: var(--spectrum-flow);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: brightness(1.12) drop-shadow(0 0 22px rgba(120, 200, 255, .18));
      animation: flow 7s linear infinite;
    }
    @keyframes flow { from { background-position: 100% 0; } to { background-position: 0% 0; } }

    /* ── Search: the prompt pill ── */
    .ask {
      position: relative;
      height: 60px;
    }
    .ask svg {
      position: absolute;
      left: 22px;
      top: 50%;
      width: 20px;
      height: 20px;
      margin-top: -10px;
      z-index: 1;
      pointer-events: none;
    }
    #faq-filter {
      width: 100%;
      height: 100%;
      padding: 0 24px 0 56px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: var(--radius-pill);
      background: var(--glass);
      color: var(--fg-hero);
      font: 500 15px/1 var(--font-mono);
      outline: none;
      backdrop-filter: blur(var(--blur-sm));
      -webkit-backdrop-filter: blur(var(--blur-sm));
      transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
    }
    #faq-filter::placeholder { color: rgba(241, 252, 255, .42); }
    #faq-filter:hover { border-color: rgba(255, 255, 255, .24); }
    #faq-filter:focus {
      border-color: rgba(15, 191, 250, .7);
      background: rgba(14, 15, 18, .75);
      box-shadow: var(--shadow-focus);
    }
    .faq-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-16);
      margin-top: 22px;
    }
    .faq-toolbar .meta {
      font-size: 11.5px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(241, 252, 255, .64);
    }
    .faq-toolbar .meta::before { content: "\203A  "; color: #a9e722; }

    /* ── Button (default) ── */
    .btn,
    .faq-toolbar button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px var(--space-16);
      border: 1px solid var(--line-2);
      border-radius: var(--radius-sm);
      background: var(--wash);
      color: var(--fg);
      font: 400 12px/1.4 var(--font-mono);
      letter-spacing: .14em;
      text-transform: uppercase;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: border-color .2s ease, background .2s ease, transform .12s ease;
    }
    .btn:hover,
    .faq-toolbar button:hover {
      color: var(--fg);
      border-color: var(--line-hover);
      background: rgba(255, 255, 255, .07);
    }
    .btn:active,
    .faq-toolbar button:active { transform: translateY(1px); }

    .faq-empty {
      margin: var(--space-48) 0 0;
      color: var(--fg-dim);
    }
    .faq-empty::before { content: "\203A  "; color: var(--amber); }

    /* ── Categories and questions: numbered hairline rows ── */
    .faq-list {
      counter-reset: cat;
      padding: var(--space-48) 0 var(--space-72);
    }
    .cat {
      counter-increment: cat;
      counter-reset: q;
      border-top: 1px solid var(--line);
    }
    .cat:last-child { border-bottom: 1px solid var(--line); }
    .cat > summary {
      display: flex;
      align-items: baseline;
      gap: var(--space-16);
      padding: 26px 2px;
      font-size: clamp(22px, 3vw, 28px);
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -.015em;
      cursor: pointer;
      list-style: none;
      user-select: none;
    }
    .cat > summary::-webkit-details-marker { display: none; }
    .cat > summary::before {
      content: counter(cat, decimal-leading-zero) " \2014";
      flex: none;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .24em;
      color: var(--fg-faint);
    }
    .cat > summary::after,
    .q > summary::after {
      content: "+";
      margin-left: auto;
      color: var(--cyan);
      font-weight: 400;
    }
    .cat > summary::after { font-size: 22px; }
    .cat[open] > summary::after,
    .q[open] > summary::after { content: "\2212"; }
    /* Chip */
    .cat .count {
      align-self: center;
      padding: 4px 10px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: var(--radius-pill);
      color: rgba(241, 252, 255, .7);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.4;
      font-variant-numeric: tabular-nums;
    }
    .cat-body { padding: 0 0 var(--space-24) 2px; }

    .q {
      counter-increment: q;
      border-top: 1px solid var(--line);
    }
    .q > summary {
      display: flex;
      align-items: baseline;
      gap: var(--space-16);
      padding: 18px 2px;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: -.01em;
      cursor: pointer;
      list-style: none;
    }
    .q > summary::-webkit-details-marker { display: none; }
    .q > summary::before {
      content: counter(q, decimal-leading-zero);
      flex: none;
      width: 22px;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .2em;
      color: var(--fg-faint);
    }
    .q > summary::after { font-size: 18px; }
    .q-body {
      padding: 0 0 22px 38px;
      max-width: 76ch;
      color: var(--fg-dim);
      font-size: 14px;
    }
    .q-body > :first-child { margin-top: 0; }
    .q[hidden], .cat[hidden] { display: none; }
    .permalink {
      font-size: 12px;
      color: var(--fg-faint);
      word-break: break-all;
    }
    .permalink::before { content: "\203A  "; color: var(--green); }
    .permalink a { color: var(--code-tint); text-decoration-color: rgba(15, 191, 250, .45); }

    /* ── Answer page ── */
    .answer-page { padding: var(--space-72) 0; }
    .answer-page h1 {
      margin: var(--space-12) 0 var(--space-24);
      font-size: clamp(26px, 3.6vw, 40px);
      font-weight: 600;
      line-height: 1.14;
      letter-spacing: -.015em;
    }
    .answer-body {
      max-width: 76ch;
      color: var(--fg-dim);
    }
    .backlink { margin-top: var(--space-48); }

    /* ── Content inside answers ── */
    code {
      font: 400 13px var(--font-mono);
      padding: 1px 6px;
      border-radius: var(--radius-xs);
      background: rgba(255, 255, 255, .08);
      color: var(--code-tint);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      margin: var(--space-24) 0;
      border-top: 1px solid var(--line);
    }
    th {
      text-align: left;
      padding: 10px 12px;
      color: var(--fg-faint);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .24em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--line);
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
    }
    td:first-child { color: var(--fg); font-weight: 600; }
    td:last-child { text-align: right; }
    tr:last-child td { border-bottom: none; }

    .image-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 18px;
      margin: var(--space-24) 0;
    }
    .image-gallery a {
      display: block;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, rgba(255, 255, 255, .035), rgba(255, 255, 255, 0));
      cursor: zoom-in;
      transition: border-color .2s ease, transform .2s ease;
    }
    .image-gallery a:hover { border-color: var(--line-2); transform: translateY(-2px); }
    .image-gallery img {
      display: block;
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    /* ── Lightbox ── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 4.5rem 1.25rem 1.25rem;
      background: rgba(14, 15, 18, .9);
      backdrop-filter: blur(var(--blur-sm));
      -webkit-backdrop-filter: blur(var(--blur-sm));
    }
    .lightbox[hidden] { display: none; }
    .lightbox img {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 5.75rem);
      object-fit: contain;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
    }
    .lightbox__close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 48px;
      height: 48px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 50%;
      background: var(--glass);
      color: rgba(241, 252, 255, .8);
      font: 400 24px/1 var(--font-mono);
      cursor: pointer;
    }
    .lightbox__close:hover {
      background: rgba(255, 255, 255, .08);
      border-color: rgba(255, 255, 255, .28);
    }
    body.lightbox-open { overflow: hidden; }

    @media (max-width: 600px) {
      .q > summary { font-size: 15.5px; }
      .q-body { padding-left: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .poster i.flow { animation: none; }
      .image-gallery a:hover { transform: none; }
      .btn, .faq-toolbar button, .image-gallery a, #faq-filter { transition: none; }
    }
  </style>
</head>
<body>
  <div id="page">
    <nav class="nav{% unless page.title %} nav--clear{% endunless %}">
      <div class="wrap">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        {% if page.title %}<a class="nav-link" href="{{ '/' | relative_url }}">All questions</a>{% endif %}
      </div>
    </nav>
    <main>
      {{ content }}
    </main>
  </div>

  <div class="lightbox" role="dialog" aria-modal="true" aria-label="Image preview" hidden>
    <button class="lightbox__close" type="button" aria-label="Close image preview">&times;</button>
    <img class="lightbox__image" src="" alt="">
  </div>

  <script>
    (() => {
      const lightbox = document.querySelector('.lightbox');
      const lightboxImage = lightbox.querySelector('.lightbox__image');
      const closeButton = lightbox.querySelector('.lightbox__close');
      const page = document.getElementById('page');
      let opener = null;

      const closeLightbox = () => {
        lightbox.hidden = true;
        lightboxImage.src = '';
        lightboxImage.alt = '';
        document.body.classList.remove('lightbox-open');
        page.inert = false;
        opener?.focus();
        opener = null;
      };

      document.addEventListener('click', (event) => {
        const link = event.target.closest('[data-lightbox]');
        if (!link) return;

        event.preventDefault();
        opener = link;
        lightboxImage.src = link.href;
        lightboxImage.alt = link.querySelector('img')?.alt || '';
        lightbox.hidden = false;
        document.body.classList.add('lightbox-open');
        page.inert = true;
        closeButton.focus();
      });

      closeButton.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) closeLightbox();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !lightbox.hidden) closeLightbox();
      });
    })();
  </script>

  <!-- ── index accordion: deep links, search filter, expand all ── -->
  <script>
    (() => {
      const list = document.querySelector('.faq-list');
      if (!list) return;

      const cats = [...list.querySelectorAll('details.cat')];
      const items = [...list.querySelectorAll('details.q')];
      const filter = document.getElementById('faq-filter');
      const expandBtn = document.getElementById('faq-expand');
      const empty = document.querySelector('.faq-empty');
      const filtering = () => filter.value.trim() !== '';

      // Open the category + question a #anchor points at, so every link
      // already shared on Discord still lands on a visible answer.
      const revealHash = (scroll) => {
        const id = decodeURIComponent(location.hash.slice(1));
        if (!id) return;
        const target = document.getElementById(id);
        if (!target || !target.classList.contains('q')) return;
        target.closest('details.cat')?.setAttribute('open', '');
        target.open = true;
        if (scroll) target.scrollIntoView({ block: 'center' });
      };
      revealHash(true);
      window.addEventListener('hashchange', () => revealHash(true));

      // Keep the URL pointing at whatever question is being read.
      items.forEach((q) => {
        q.addEventListener('toggle', () => {
          if (q.open && !filtering()) history.replaceState(null, '', '#' + q.id);
        });
      });

      const syncExpandBtn = () => {
        const allOpen = cats.every((c) => c.open);
        expandBtn.textContent = allOpen ? 'Collapse all' : 'Expand all';
        expandBtn.setAttribute('aria-expanded', String(allOpen));
      };
      expandBtn.addEventListener('click', () => {
        const open = !cats.every((c) => c.open);
        cats.forEach((c) => { c.open = open; });
        syncExpandBtn();
      });
      cats.forEach((c) => c.addEventListener('toggle', syncExpandBtn));
      syncExpandBtn();

      // Search: matches title + summary + answer text (see _includes/faq-item.html).
      // While filtering, matching categories are force-opened; the pre-search
      // open/closed state is restored when the box is cleared.
      let saved = null;
      const applyFilter = () => {
        const query = filter.value.trim().toLowerCase();

        if (!query) {
          items.forEach((q) => { q.hidden = false; });
          cats.forEach((c) => { c.hidden = false; });
          if (saved) {
            cats.forEach((c, i) => { c.open = saved.cats[i]; });
            items.forEach((q, i) => { q.open = saved.items[i]; });
            saved = null;
          }
          empty.hidden = true;
          syncExpandBtn();
          return;
        }

        if (!saved) {
          saved = { cats: cats.map((c) => c.open), items: items.map((q) => q.open) };
        }

        let total = 0;
        cats.forEach((cat) => {
          let shown = 0;
          cat.querySelectorAll('details.q').forEach((q) => {
            const hit = q.dataset.search.includes(query);
            q.hidden = !hit;
            if (hit) shown += 1;
          });
          cat.hidden = shown === 0;
          cat.open = shown > 0;
          total += shown;
        });
        empty.hidden = total > 0;
        syncExpandBtn();
      };

      filter.addEventListener('input', applyFilter);
      filter.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') { filter.value = ''; applyFilter(); }
      });
      if (filter.value) applyFilter(); // e.g. restored on back/forward
    })();
  </script>
</body>
</html>
