---
layout: default
---
<div class="wrap">
  <article class="answer-page">
    {% if page.category %}<p class="eyebrow">{{ page.category }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    <div class="answer-body">
      {{ content }}
    </div>
    <a class="btn backlink" href="{{ '/' | relative_url }}#{{ page.url | slugify }}">← All questions</a>
  </article>
</div>
